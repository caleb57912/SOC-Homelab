[MISP - Build DNS IOC lookup]
description = Rebuilds misp_dns_iocs.csv from MISP domain and hostname indicators (to_ids). Runs 28 min after the MISP feed fetch.
search = | mispgetioc misp_instance=misp01 last=3650d type="domain,hostname" to_ids=true limit=5000\
| eval ioc=lower(coalesce(misp_domain, misp_hostname))\
| where isnotnull(ioc)\
| stats values(misp_event_id) as misp_event_id values(misp_event_info) as misp_event_info values(misp_tag) as misp_tag first(misp_type) as misp_type by ioc\
| outputlookup misp_dns_iocs.csv
enableSched = 1
cron_schedule = 45 */6 * * *
dispatch.earliest_time = -60m
dispatch.latest_time = now
