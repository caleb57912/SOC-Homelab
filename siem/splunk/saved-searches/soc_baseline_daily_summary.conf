[SOC - Baseline daily summary]
description = Daily event counts and active hours per index/sourcetype/source/host for the previous UTC day, written to index=baseline
search = | tstats count where index=* NOT index=baseline earliest=-1d@d latest=@d by _time span=1h index sourcetype source host\
| stats sum(count) as events dc(_time) as active_hours by index sourcetype source host\
| eval _time=relative_time(now(),"-1d@d"), day=strftime(_time,"%Y-%m-%d")\
| collect index=baseline source=baseline_daily
enableSched = 1
cron_schedule = 15 0 * * *
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
schedule_window = 0
