[wazuh:alerts]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = "timestamp":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
TRUNCATE = 50000
KV_MODE = json

[pihole:dnsmasq]
EXTRACT-dns_query = query\[(?<record_type>[^\]]+)\]\s+(?<query>\S+)\s+from\s+(?<src>\S+)

[zeek:conn]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TIME_PREFIX = ^\{"ts":
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
TRUNCATE = 20000
KV_MODE = json

